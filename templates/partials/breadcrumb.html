<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb erp-breadcrumb mb-0">
        {% for crumb in crumbs %}
            {% if crumb.url %}
            <li class="breadcrumb-item"><a href="{{ crumb.url }}">{{ crumb.label }}</a></li>
            {% else %}
            <li class="breadcrumb-item active" aria-current="page">{{ crumb.label }}</li>
            {% endif %}
        {% endfor %}
    </ol>
</nav>
